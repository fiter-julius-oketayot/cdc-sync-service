# Oracle GoldenGate CDC Implementation (FREE Edition)
# This project uses Oracle GoldenGate Free Edition for Change Data Capture
#
# IMPORTANT: Before running docker-compose up, you must login to Oracle Container Registry:
#   docker login container-registry.oracle.com
#   Username: Your Oracle Account Email
#   Password: Your Oracle Account Auth Token
#
# To create an Auth Token:
#   1. Go to https://container-registry.oracle.com
#   2. Accept the Oracle Standard Terms and Restrictions for GoldenGate
#   3. Sign in with your Oracle account
#   4. Click your profile -> User Settings -> Auth Tokens -> Generate Token
#
# Note: GoldenGate Free Edition is FREE for both development and production use!

services:
  # PostgreSQL Target Database
  postgres-db:
    image: postgres:16
    container_name: postgres-db
    hostname: postgres-db
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    # Configure PostgreSQL for logical replication so existing slots like
    # "debezium_postgres_slot" work correctly
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=10", "-c", "max_wal_senders=10"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/setup-postgres.sql:/docker-entrypoint-initdb.d/setup.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ogg-network

  # Oracle Source Database
  oracle-db:
    image: gvenzl/oracle-xe:21-slim
    container_name: oracle-db
    hostname: oracle-db
    environment:
      ORACLE_PASSWORD: oracle
      ORACLE_DATABASE: XE
      ORACLE_CHARACTERSET: AL32UTF8
    ports:
      - "1521:1521"
    volumes:
      - oracle_data:/opt/oracle/oradata
      - ./scripts:/setup-scripts
    healthcheck:
      test: ["CMD", "sqlplus", "sys/oracle@//localhost:1521/XE", "as", "sysdba", "-V"]
      interval: 30s
      timeout: 10s
      retries: 10
    networks:
      - ogg-network

  # Oracle GoldenGate for Oracle (Extract/Pump)
  goldengate-oracle:
    # Using Oracle GoldenGate Free Edition for Oracle
    # Requires login: docker login container-registry.oracle.com
    # License: Free for development and production use
    image: container-registry.oracle.com/goldengate/goldengate-oracle-free:latest
    container_name: goldengate-oracle
    hostname: goldengate-oracle
    restart: unless-stopped
    environment:
      OGG_SCHEMA: oggadmin
      OGG_ADMIN: oggadmin
      OGG_ADMIN_PWD: Welcome1!
      OGG_DEPLOYMENT: Local
      ORACLE_SID: XE
      ORACLE_HOME: /opt/oracle/product/21c/dbhomeXE
    ports:
      - "9100:443"  # GoldenGate Web UI (HTTPS)
      - "7809:7809" # Manager port
    volumes:
      - ogg_oracle_data:/u02/ogg
      - ./scripts/ogg-oracle:/setup-scripts
    depends_on:
      oracle-db:
        condition: service_healthy
    networks:
      - ogg-network
    # The web UI should be available on port 9100 (HTTPS)

  # Oracle GoldenGate for PostgreSQL (Replicat)
  goldengate-postgres:
    # Using Oracle GoldenGate Free Edition for PostgreSQL
    # Requires login: docker login container-registry.oracle.com
    # License: Free for development and production use
    image: container-registry.oracle.com/goldengate/goldengate-postgresql-free:latest
    container_name: goldengate-postgres
    hostname: goldengate-postgres
    restart: unless-stopped
    environment:
      OGG_SCHEMA: oggadmin
      OGG_ADMIN: oggadmin
      OGG_ADMIN_PWD: Welcome1!
      OGG_DEPLOYMENT: Local
    ports:
      - "9200:443"  # GoldenGate Web UI (HTTPS)
      - "7810:7809" # Manager port
    volumes:
      - ogg_postgres_data:/u02/ogg
      - ./scripts/ogg-postgres:/setup-scripts
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - ogg-network
    # The web UI should be available on port 9200 (HTTPS)

networks:
  ogg-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  oracle_data:
    driver: local
  ogg_oracle_data:
    driver: local
  ogg_oracle_etc:
    driver: local
  ogg_postgres_data:
    driver: local
  ogg_postgres_etc:
    driver: local




